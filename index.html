<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Private Suite | الخصوصية المطلقة</title>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sortablejs/1.15.0/Sortable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f7fa; }
        .page-card { cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .page-card:active { cursor: grabbing; transform: scale(0.98); }
        .ghost-class { opacity: 0.4; background: #dbeafe; border: 2px dashed #3b82f6; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border border-slate-700">
        <div class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-4xl">🔐</span>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-slate-800">منطقة خاصة</h2>
        <p class="text-gray-500 mb-8 text-sm">يرجى إدخال رمز الوصول للمتابعة</p>
        
        <input type="password" id="passCode" maxlength="6" 
               class="w-full text-center text-3xl tracking-[0.3em] p-4 border-2 border-slate-200 rounded-2xl mb-4 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition-all placeholder:text-slate-200" 
               placeholder="******">
               
        <button onclick="checkAuth()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition active:scale-95 shadow-lg shadow-blue-200">
            تأكيد الدخول
        </button>
        <p id="errorMsg" class="text-red-500 mt-4 hidden font-bold text-sm bg-red-50 py-2 rounded-lg">⚠️ الرمز الذي أدخلته غير صحيح</p>
    </div>
</div>

    <div id="mainApp" class="hidden container mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">PDF-Merge <span class="text-slate-400 font-light">| Private Edition</span></h1>
                <p class="text-xs text-slate-500">تتم المعالجة بالكامل داخل متصفحك. لا ترفع أي ملفات للخادم.</p>
            </div>
            <div class="flex gap-3">
                <button onclick="saveFinalPDF()" id="saveBtn" class="hidden bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg flex items-center gap-2">
                    <span>💾 حفظ وتحميل النتيجة</span>
                </button>
                <button onclick="location.reload()" class="bg-slate-100 text-slate-600 px-4 py-3 rounded-xl hover:bg-red-50 hover:text-red-600 transition">خروج</button>
            </div>
        </header>

        <div id="uploadArea" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white border-4 border-dashed border-blue-50 p-10 rounded-3xl text-center hover:border-blue-200 transition group">
                <input type="file" id="pdfInput" multiple accept=".pdf" class="hidden" onchange="loadFiles(this.files, 'pdf')">
                <label for="pdfInput" class="cursor-pointer">
                    <div class="text-5xl mb-3 group-hover:scale-110 transition">📄</div>
                    <p class="font-bold text-slate-700">إضافة ملفات PDF</p>
                    <p class="text-xs text-slate-400 mt-1">دمج، ترتيب، تدوير، أو تقسيم</p>
                </label>
            </div>
            <div class="bg-white border-4 border-dashed border-green-50 p-10 rounded-3xl text-center hover:border-green-200 transition group">
                <input type="file" id="imgInput" multiple accept="image/*" class="hidden" onchange="loadFiles(this.files, 'img')">
                <label for="imgInput" class="cursor-pointer">
                    <div class="text-5xl mb-3 group-hover:scale-110 transition">🖼️</div>
                    <p class="font-bold text-slate-700">تحويل صور إلى PDF</p>
                    <p class="text-xs text-slate-400 mt-1">JPG, PNG, WEBP</p>
                </label>
            </div>
        </div>

        <div id="editorArea" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-2 h-6 bg-blue-600 rounded-full"></span>
                    معاينة وترتيب الصفحات
                </h3>
                <span id="pageCount" class="bg-slate-200 text-slate-700 px-4 py-1 rounded-full text-xs font-bold"></span>
            </div>
            
            <div id="pagesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 min-h-[200px] p-2">
                </div>
        </div>
    </div>

    <script>
        const SECRET = "061986";
        let loadedPages = [];

        function checkAuth() {
            if (document.getElementById('passCode').value === SECRET) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        async function loadFiles(files, type) {
            if (files.length === 0) return;
            document.getElementById('editorArea').classList.remove('hidden');
            document.getElementById('saveBtn').classList.remove('hidden');

            const { PDFDocument, degrees } = PDFLib;

            for (const file of files) {
                if (type === 'pdf') {
                    const bytes = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(bytes);
                    const count = pdf.getPageCount();
                    for (let i = 0; i < count; i++) {
                        loadedPages.push({ type: 'pdf', srcDoc: pdf, pageIndex: i, rotation: 0, id: Math.random().toString(36).substr(2, 9) });
                    }
                } else {
                    const bytes = await file.arrayBuffer();
                    loadedPages.push({ type: 'img', bytes: bytes, imgType: file.type, rotation: 0, id: Math.random().toString(36).substr(2, 9) });
                }
            }
            renderPages();
        }

        function renderPages() {
            const grid = document.getElementById('pagesGrid');
            grid.innerHTML = '';
            document.getElementById('pageCount').innerText = `${loadedPages.length} صفحة`;

            loadedPages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'page-card bg-white p-4 rounded-2xl shadow-sm border border-slate-200 relative';
                card.dataset.id = page.id;
                
                card.innerHTML = `
                    <div class="text-center font-bold text-[10px] text-slate-400 mb-2 uppercase tracking-tighter">صفحة ${index + 1}</div>
                    <div class="w-full h-32 bg-slate-50 rounded-xl flex items-center justify-center overflow-hidden mb-3 border border-slate-100">
                        <span class="text-3xl transition-transform duration-300" style="transform: rotate(${page.rotation}deg)">${page.type === 'pdf' ? '📄' : '🖼️'}</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="rotatePage('${page.id}')" class="bg-blue-50 text-blue-600 p-2 rounded-lg hover:bg-blue-100 flex-1 text-[10px] font-bold">🔄 تدوير</button>
                        <button onclick="deletePage('${page.id}')" class="bg-red-50 text-red-600 p-2 rounded-lg hover:bg-red-100 flex-1 text-[10px] font-bold">🗑️ حذف</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            // تفعيل السحب والإفلات مع حماية من الأخطاء
            if (typeof Sortable !== 'undefined') {
                new Sortable(grid, {
                    animation: 200,
                    ghostClass: 'ghost-class',
                    onEnd: (evt) => {
                        const movedItem = loadedPages.splice(evt.oldIndex, 1)[0];
                        loadedPages.splice(evt.newIndex, 0, movedItem);
                        renderPages();
                    }
                });
            }
        }

        function rotatePage(id) {
            const page = loadedPages.find(p => p.id === id);
            page.rotation = (page.rotation + 90) % 360;
            renderPages();
        }

        function deletePage(id) {
            loadedPages = loadedPages.filter(p => p.id !== id);
            if (loadedPages.length === 0) {
                document.getElementById('editorArea').classList.add('hidden');
                document.getElementById('saveBtn').classList.add('hidden');
            }
            renderPages();
        }

        async function saveFinalPDF() {
            const { PDFDocument, degrees } = PDFLib;
            const newPdf = await PDFDocument.create();
            
            for (const p of loadedPages) {
                if (p.type === 'pdf') {
                    const [copiedPage] = await newPdf.copyPages(p.srcDoc, [p.pageIndex]);
                    if (p.rotation !== 0) copiedPage.setRotation(degrees(p.rotation));
                    newPdf.addPage(copiedPage);
                } else {
                    let img;
                    if (p.imgType === "image/png") img = await newPdf.embedPng(p.bytes);
                    else img = await newPdf.embedJpg(p.bytes);
                    
                    const page = newPdf.addPage([img.width, img.height]);
                    page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                    if (p.rotation !== 0) page.setRotation(degrees(p.rotation));
                }
            }

            const pdfBytes = await newPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "PDF_Tools_Export.pdf";
            link.click();
        }
    </script>
</body>
</html>
