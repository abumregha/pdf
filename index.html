<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Tool Pro | Smart Sorting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const SECRET = "061986";
        function checkAuth() {
            const code = document.getElementById('passCode').value;
            if (code === SECRET) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }
    </script>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f1f5f9; }
        .file-item { transition: all 0.2s; }
        .file-item:hover { border-color: #3b82f6; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">

<div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[100] p-4 text-center">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-5xl mb-6">🔑</div>
        <h2 class="text-xl font-bold mb-6 text-slate-800">أدخل رمز الوصول</h2>
        <input type="password" id="passCode" maxlength="6" class="w-full text-center text-3xl tracking-widest p-4 border-2 border-slate-200 rounded-2xl mb-4 outline-none focus:border-blue-500" placeholder="******">
        <button onclick="checkAuth()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition">دخول</button>
        <p id="errorMsg" class="text-red-500 mt-4 hidden font-bold">الرمز غير صحيح</p>
    </div>
</div>

<div id="mainApp" class="hidden container mx-auto p-4 md:p-8 max-w-5xl">
    <header class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black text-blue-600">PDF Master</h1>
            <p class="text-xs text-slate-400">ترتيب، دمج، وتعديل احترافي</p>
        </div>
        <button onclick="location.reload()" class="text-slate-400 hover:text-red-500 text-sm">خروج</button>
    </header>

    <section id="uploadSection" class="space-y-6">
        <div onclick="document.getElementById('globalInput').click()" class="bg-white border-4 border-dashed border-slate-300 rounded-[2.5rem] p-12 text-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all group">
            <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">📂</div>
            <h2 class="text-xl font-bold text-slate-700">اضغط هنا لاختيار الملفات (PDF أو صور)</h2>
            <p class="text-slate-400 mt-2">يمكنك ترتيب الملفات ككتل قبل استخراج الصفحات</p>
            <input type="file" id="globalInput" multiple accept=".pdf,image/*" class="hidden" onchange="handleFileSelection(this)">
        </div>

        <div id="fileManager" class="hidden bg-white p-6 rounded-3xl shadow-lg border border-slate-200">
            <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                <span>📑</span> ترتيب الملفات المرفوعة:
            </h3>
            <div id="fileList" class="space-y-3 mb-6"></div>
            <div class="flex gap-3">
                <button onclick="processFiles()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-lg shadow-blue-100 transition">
                    بدء استخراج الصفحات والمعاينة ⮕
                </button>
            </div>
        </div>
    </section>

    <section id="editorArea" class="hidden space-y-8 animate-in fade-in duration-500">
        <div class="bg-blue-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-lg">
            <span class="font-bold" id="pageCountDisplay">0 صفحة جاهزة</span>
            <button onclick="location.reload()" class="bg-white/20 hover:bg-white/30 px-4 py-1 rounded-lg text-sm">إلغاء والبدء من جديد</button>
        </div>

        <div id="pagesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-slate-500 mb-2 mr-2">اسم الملف النهائي:</label>
                    <input type="text" id="outputFileName" placeholder="أدخل اسم الملف هنا..." 
                           class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none">
                </div>
                <button onclick="generatePDF()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-green-700 shadow-xl shadow-green-100 transition">
                    تحميل الملف النهائي 💾
                </button>
            </div>
        </div>
    </section>
</div>

<div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-[200] flex items-center justify-center">
    <div class="bg-white p-8 rounded-3xl text-center shadow-2xl">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p id="loadingText" class="font-bold text-slate-700">جاري المعالجة...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let selectedFiles = []; // لتخزين الملفات ككتل
    let pagesData = [];    // لتخزين الصفحات الفردية بعد المعالجة

    // 1. عند اختيار الملفات من الجهاز
    function handleFileSelection(input) {
        const files = Array.from(input.files);
        files.forEach(f => {
            selectedFiles.push({
                id: Math.random().toString(36).substr(2, 9),
                file: f,
                name: f.name,
                type: f.type
            });
        });
        input.value = '';
        renderFileManager();
    }

    // 2. عرض قائمة الملفات للترتيب الجماعي
    function renderFileManager() {
        const manager = document.getElementById('fileManager');
        const list = document.getElementById('fileList');
        
        if (selectedFiles.length > 0) {
            manager.classList.remove('hidden');
            list.innerHTML = selectedFiles.map((f, i) => `
                <div class="file-item flex items-center justify-between p-4 border-2 border-slate-100 rounded-2xl bg-slate-50">
                    <div class="flex items-center gap-3">
                        <span class="bg-slate-200 text-slate-600 w-8 h-8 flex items-center justify-center rounded-full font-bold text-xs">${i + 1}</span>
                        <div>
                            <p class="font-bold text-slate-700 text-sm truncate max-w-[200px]">${f.name}</p>
                            <p class="text-[10px] text-slate-400">${f.type || 'Document'}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="moveFile(${i}, -1)" class="p-2 hover:bg-white rounded-lg transition">⬆️</button>
                        <button onclick="moveFile(${i}, 1)" class="p-2 hover:bg-white rounded-lg transition">⬇️</button>
                        <button onclick="removeFile(${i})" class="p-2 hover:text-red-500 transition">🗑️</button>
                    </div>
                </div>
            `).join('');
        } else {
            manager.classList.add('hidden');
        }
    }

    function moveFile(index, dir) {
        const newIdx = index + dir;
        if (newIdx >= 0 && newIdx < selectedFiles.length) {
            const temp = selectedFiles[index];
            selectedFiles[index] = selectedFiles[newIdx];
            selectedFiles[newIdx] = temp;
            renderFileManager();
        }
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderFileManager();
    }

    // 3. تحويل الملفات المرتبة إلى صفحات فردية للمعاينة
    async function processFiles() {
        toggleLoader(true, "جاري استخراج الصفحات...");
        pagesData = [];
        
        for (const fileObj of selectedFiles) {
            const file = fileObj.file;
            const arrayBuffer = await file.arrayBuffer();
            
            if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
                const pdfLibDoc = await PDFLib.PDFDocument.load(arrayBuffer.slice(0));
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 0.4 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: context, viewport }).promise;
                    
                    pagesData.push({
                        id: Math.random().toString(36).substr(2, 9),
                        thumb: canvas.toDataURL('image/jpeg', 0.6),
                        type: 'pdf',
                        sourceDoc: pdfLibDoc,
                        pageIdx: i - 1,
                        rotation: 0
                    });
                }
            } else if (file.type.startsWith('image/')) {
                const thumb = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = e => r(e.target.result);
                    reader.readAsDataURL(file);
                });
                pagesData.push({
                    id: Math.random().toString(36).substr(2, 9),
                    thumb: thumb,
                    type: 'img',
                    bytes: arrayBuffer.slice(0),
                    imgType: file.type,
                    rotation: 0
                });
            }
        }
        
        document.getElementById('uploadSection').classList.add('hidden');
        document.getElementById('editorArea').classList.remove('hidden');
        toggleLoader(false);
        updateUI();
    }

    function updateUI() {
        const grid = document.getElementById('pagesGrid');
        grid.innerHTML = '';
        document.getElementById('pageCountDisplay').innerText = `${pagesData.length} صفحة جاهزة`;

        pagesData.forEach((page, index) => {
            const div = document.createElement('div');
            div.className = "bg-white p-2 rounded-2xl shadow-sm border border-slate-200 relative";
            div.innerHTML = `
                <div class="h-40 bg-slate-50 rounded-xl overflow-hidden flex items-center justify-center mb-2">
                    <img src="${page.thumb}" class="max-w-full max-h-full transition-transform" style="transform: rotate(${page.rotation}deg)">
                </div>
                <div class="grid grid-cols-4 gap-1">
                    <button onclick="movePage(${index}, -1)" class="p-1 bg-slate-100 rounded hover:bg-blue-100">⬆️</button>
                    <button onclick="movePage(${index}, 1)" class="p-1 bg-slate-100 rounded hover:bg-blue-100">⬇️</button>
                    <button onclick="rotatePage(${index})" class="p-1 bg-blue-50 text-blue-600 rounded hover:bg-blue-100">🔄</button>
                    <button onclick="removePage(${index})" class="p-1 bg-red-50 text-red-600 rounded hover:bg-red-100">🗑️</button>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function movePage(index, dir) {
        const newIdx = index + dir;
        if (newIdx >= 0 && newIdx < pagesData.length) {
            const item = pagesData.splice(index, 1)[0];
            pagesData.splice(newIdx, 0, item);
            updateUI();
        }
    }

    function rotatePage(index) {
        pagesData[index].rotation = (pagesData[index].rotation + 90) % 360;
        updateUI();
    }

    function removePage(index) {
        pagesData.splice(index, 1);
        updateUI();
    }

    async function generatePDF() {
        if (!pagesData.length) return;
        toggleLoader(true, "جاري بناء ملف الـ PDF...");
        
        try {
            const finalDoc = await PDFLib.PDFDocument.create();
            for (const page of pagesData) {
                if (page.type === 'pdf') {
                    const [copiedPage] = await finalDoc.copyPages(page.sourceDoc, [page.pageIdx]);
                    copiedPage.setRotation(PDFLib.degrees(page.rotation));
                    finalDoc.addPage(copiedPage);
                } else {
                    const img = page.imgType === 'image/png' ? await finalDoc.embedPng(page.bytes) : await finalDoc.embedJpg(page.bytes);
                    const p = finalDoc.addPage([img.width, img.height]);
                    p.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                    p.setRotation(PDFLib.degrees(page.rotation));
                }
            }
            const pdfBytes = await finalDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = (document.getElementById('outputFileName').value || 'merged_file') + '.pdf';
            link.click();
        } catch (e) { alert("خطأ في التصدير"); }
        toggleLoader(false);
    }

    function toggleLoader(s, t) {
        document.getElementById('loadingOverlay').classList.toggle('hidden', !s);
        document.getElementById('loadingText').innerText = t;
    }
</script>
</body>
</html>
