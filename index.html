<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Private Suite | الخصوصية المطلقة</title>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sortablejs/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f7fa; }
        .page-card { cursor: grab; transition: transform 300ms cubic-bezier(.2,.9,.2,1), box-shadow 200ms ease, opacity 200ms; will-change: transform, opacity; }
        .page-card:active { cursor: grabbing; transform: scale(0.98); }
        .ghost-class { opacity: 0.4; background: #dbeafe; border: 2px dashed #3b82f6; }
        /* smoother thumbnail transitions */
        .thumbnail-handle img { transition: transform 300ms cubic-bezier(.2,.9,.2,1); }
        /* small flash animation when a card is dropped to indicate movement */
        @keyframes reorderFlash {
            0% { transform: scale(1.02); box-shadow: 0 20px 40px rgba(59,130,246,0.12); }
            100% { transform: none; box-shadow: none; }
        }
        .page-card.reorder-flash { animation: reorderFlash 320ms ease forwards; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border border-slate-700">
        <div class="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-4xl">🔐</span>
        </div>
        <p class="text-gray-500 mb-8 text-sm">يرجى إدخال رمز الوصول للمتابعة</p>
        
        <input type="password" id="passCode" maxlength="6" 
               class="w-full text-center text-3xl tracking-[0.3em] p-4 border-2 border-slate-200 rounded-2xl mb-4 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition-all placeholder:text-slate-200" 
               placeholder="******">
               
        <button onclick="checkAuth()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition active:scale-95 shadow-lg shadow-blue-200">
            تأكيد الدخول
        </button>
        <p id="errorMsg" class="text-red-500 mt-4 hidden font-bold text-sm bg-red-50 py-2 rounded-lg">⚠️ الرمز الذي أدخلته غير صحيح</p>
    </div>
</div>

    <div id="mainApp" class="hidden container mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-600">PDF-Merge <span class="text-slate-400 font-light">| Private Edition</span></h1>
                <p class="text-xs text-slate-500">تتم المعالجة بالكامل داخل متصفحك. لا ترفع أي ملفات للخادم.</p>
            </div>
            <div class="flex gap-3 items-center">
                <div class="flex items-center gap-3">
                  <label class="flex items-center gap-2 text-sm text-slate-600 bg-slate-100 px-3 py-2 rounded-xl">
                    <input type="checkbox" id="highQuality" checked class="h-4 w-4">
                    جودة عالية
                  </label>
                  <button onclick="saveFinalPDF()" id="saveBtn" class="hidden bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg flex items-center gap-2">
                    <span>💾 حفظ وتحميل</span>
                  </button>
                </div>                <button onclick="loadSampleDemo()" id="demoBtn" class="bg-green-600 text-white px-4 py-3 rounded-xl hover:bg-green-700 transition">عرض توضيحي</button>                <button onclick="location.reload()" class="bg-slate-100 text-slate-600 px-4 py-3 rounded-xl hover:bg-red-50 hover:text-red-600 transition">خروج</button>
            </div>
        </header>

        <div id="uploadArea" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white border-4 border-dashed border-blue-50 p-10 rounded-3xl text-center hover:border-blue-200 transition group">
                <input type="file" id="pdfInput" multiple accept=".pdf" class="hidden" onchange="loadFiles(this.files, 'pdf')">
                <label for="pdfInput" class="cursor-pointer">
                    <div class="text-5xl mb-3 group-hover:scale-110 transition">📄</div>
                    <p class="font-bold text-slate-700">إضافة ملفات PDF</p>
                    <p class="text-xs text-slate-400 mt-1">دمج، ترتيب، تدوير، أو تقسيم</p>
                </label>
            </div>
            <div class="bg-white border-4 border-dashed border-green-50 p-10 rounded-3xl text-center hover:border-green-200 transition group">
                <input type="file" id="imgInput" multiple accept="image/*" class="hidden" onchange="loadFiles(this.files, 'img')">
                <label for="imgInput" class="cursor-pointer">
                    <div class="text-5xl mb-3 group-hover:scale-110 transition">🖼️</div>
                    <p class="font-bold text-slate-700">تحويل صور إلى PDF</p>
                    <p class="text-xs text-slate-400 mt-1">JPG, PNG, WEBP</p>
                </label>
            </div>
        </div>

        <div id="editorArea" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <span class="w-2 h-6 bg-blue-600 rounded-full"></span>
                    معاينة وترتيب الصفحات
                </h3>
                <span id="pageCount" class="bg-slate-200 text-slate-700 px-4 py-1 rounded-full text-xs font-bold"></span>
            </div>
            
            <div id="pagesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 min-h-[200px] p-2">
                </div>

            <!-- Full page preview modal -->
            <div id="previewModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
              <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full mx-auto p-4 relative">
                <button id="closePreview" class="absolute top-3 left-3 bg-slate-100 rounded-full p-2">✖️</button>
                <div class="flex items-center justify-between mb-3">
                  <div class="text-sm text-slate-600" id="previewLabel">صفحة 1</div>
                  <div class="flex gap-2">
                    <button id="prevPage" class="bg-slate-100 p-2 rounded-md">⬅️</button>
                    <button id="nextPage" class="bg-slate-100 p-2 rounded-md">➡️</button>
                    <button id="rotatePreview" class="bg-blue-600 text-white px-3 py-2 rounded-md">🔄 تدوير</button>
                    <button id="deletePreview" class="bg-red-50 text-red-600 px-3 py-2 rounded-md">🗑️ حذف</button>
                  </div>
                </div>
                <div class="w-full h-[70vh] flex items-center justify-center">
                  <canvas id="previewCanvas" class="max-w-full max-h-full bg-slate-50 rounded-lg"></canvas>
                </div>
              </div>
            </div>

            <!-- Loader / progress overlay -->
            <div id="loaderOverlay" class="fixed inset-0 bg-black/40 hidden z-60 flex items-center justify-center p-4">
              <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 text-center">
                <div id="loaderText" class="font-bold text-slate-700 mb-3">جاري تحميل الملفات...</div>
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                  <div id="loaderBar" class="h-4 bg-blue-600 w-0"></div>
                </div>
                <div id="loaderPercent" class="text-xs text-slate-500 mt-3">0%</div>
                <div class="mt-4 text-xs text-slate-400">هذا قد يستغرق بعض الوقت للملفات الكبيرة أو الـ PDFs متعددة الصفحات.</div>
              </div>
            </div>
        </div>
    </div>

    <script>
        const SECRET = "061986";
        let loadedPages = [];

        function checkAuth() {
            if (document.getElementById('passCode').value === SECRET) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        async function loadFiles(files, type) {
            if (files.length === 0) return;
            document.getElementById('editorArea').classList.remove('hidden');
            document.getElementById('saveBtn').classList.remove('hidden');

            const { PDFDocument, degrees } = PDFLib;
            // First pass: gather tasks and compute total items to process for progress
            const tasks = [];
            let total = 0;

            for (const file of files) {
                if (type === 'pdf') {
                    const bytes = await file.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(bytes);
                    let pdfJsDoc = null;
                    if (typeof pdfjsLib !== 'undefined') {
                        try { pdfJsDoc = await pdfjsLib.getDocument({ data: bytes }).promise; } catch (e) { console.warn('PDF.js thumbnail failed', e); }
                    }
                    const count = pdfDoc.getPageCount();
                    tasks.push({ type: 'pdf', pdfDoc, pdfJsDoc, bytes, pages: count });
                    total += count;
                } else {
                    const bytes = await file.arrayBuffer();
                    tasks.push({ type: 'img', bytes, imgType: file.type });
                    total += 1;
                }
            }

            // Show loader and process tasks
            let processed = 0;
            showLoader(total);

            for (const task of tasks) {
                if (task.type === 'pdf') {
                    for (let i = 0; i < task.pages; i++) {
                        const thumb = task.pdfJsDoc ? await renderPdfPageToThumbnail(task.pdfJsDoc, i + 1) : null;
                        loadedPages.push({ type: 'pdf', srcDoc: task.pdfDoc, pdfJs: task.pdfJsDoc, pageIndex: i, rotation: 0, id: Math.random().toString(36).substr(2, 9), thumbnail: thumb });
                        processed++;
                        updateLoader(processed, total);
                    }
                } else {
                    const blob = new Blob([task.bytes], { type: task.imgType });
                    const thumb = await renderImageToThumbnail(blob);
                    loadedPages.push({ type: 'img', bytes: task.bytes, imgType: task.imgType, rotation: 0, id: Math.random().toString(36).substr(2, 9), thumbnail: thumb });
                    processed++;
                    updateLoader(processed, total);
                }
            }

            hideLoader();
            renderPages();
        }

        function renderPages() {
            const grid = document.getElementById('pagesGrid');
            grid.innerHTML = '';
            document.getElementById('pageCount').innerText = `${loadedPages.length} صفحة`;

            loadedPages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'page-card bg-white p-4 rounded-2xl shadow-sm border border-slate-200 relative';
                card.dataset.id = page.id;

                const thumbHTML = page.thumbnail ? `<img src="${page.thumbnail}" alt="thumb" class="w-full h-full object-contain transition-transform duration-300" style="transform: rotate(${page.rotation}deg)">` 
                                                  : `<div class="w-full h-full flex items-center justify-center text-3xl">${page.type === 'pdf' ? '📄' : '🖼️'}</div>`;
                card.innerHTML = `
                    <div class="text-center font-bold text-[10px] text-slate-400 mb-2 uppercase tracking-tighter">صفحة ${index + 1}</div>
                    <div onclick="openPreview(${index})" class="thumbnail-handle w-full h-32 bg-slate-50 rounded-xl flex items-center justify-center overflow-hidden mb-3 border border-slate-100 cursor-move">
                        ${thumbHTML}
                    </div>
                    <div class="flex gap-1">
                        <button onclick="rotatePage('${page.id}')" class="bg-blue-50 text-blue-600 p-2 rounded-lg hover:bg-blue-100 flex-1 text-[10px] font-bold">🔄 تدوير</button>
                        <button onclick="deletePage('${page.id}')" class="bg-red-50 text-red-600 p-2 rounded-lg hover:bg-red-100 flex-1 text-[10px] font-bold">🗑️ حذف</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            // تفعيل السحب والإفلات مع حماية من الأخطاء
            if (typeof Sortable !== 'undefined') {
                // ensure a single Sortable instance for the pages grid
                if (window.pagesSortable && typeof window.pagesSortable.destroy === 'function') {
                    try { window.pagesSortable.destroy(); } catch (e) { console.warn('destroy sortable failed', e); }
                }
                window.pagesSortable = new Sortable(grid, {
                    animation: 300,
                    easing: 'cubic-bezier(.2,.9,.2,1)',
                    ghostClass: 'ghost-class',
                    handle: '.thumbnail-handle', // drag by the thumbnail area
                    draggable: '.page-card',
                    filter: 'button, input, a',
                    preventOnFilter: false,
                    onEnd: (evt) => {
                        const movedItem = loadedPages.splice(evt.oldIndex, 1)[0];
                        loadedPages.splice(evt.newIndex, 0, movedItem);
                        renderPages();
                        // after rendering, briefly flash the moved card for UX feedback
                        setTimeout(() => {
                            const el = document.querySelector(`.page-card[data-id="${movedItem.id}"]`);
                            if (el) {
                                el.classList.add('reorder-flash');
                                setTimeout(() => el.classList.remove('reorder-flash'), 350);
                            }
                        }, 30);
                    }
                });
            }
        }

        function rotatePage(id) {
            const page = loadedPages.find(p => p.id === id);
            page.rotation = (page.rotation + 90) % 360;
            renderPages();
        }

        function deletePage(id) {
            const index = loadedPages.findIndex(p => p.id === id);
            loadedPages = loadedPages.filter(p => p.id !== id);
            // If we were previewing this page, advance preview index
            if (typeof currentPreviewIndex !== 'undefined') {
                if (loadedPages.length === 0) {
                    closePreview();
                } else {
                    currentPreviewIndex = Math.min(currentPreviewIndex, loadedPages.length - 1);
                    if (document.getElementById('previewModal').classList.contains('hidden') === false) showPreview(currentPreviewIndex);
                }
            }
            if (loadedPages.length === 0) {
                document.getElementById('editorArea').classList.add('hidden');
                document.getElementById('saveBtn').classList.add('hidden');
            }
            renderPages();
        }

        // ----- Thumbnail & Preview helpers -----
        async function loadSampleDemo() {
            // Create a simple 2-page PDF for demo using pdf-lib
            const { PDFDocument, StandardFonts } = PDFLib;
            const pdfDoc = await PDFDocument.create();
            const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

            const page1 = pdfDoc.addPage([595, 842]); // A4
            page1.drawText('PDF Tools — Demo Page 1', { x: 40, y: 780, size: 24, font });
            page1.drawText('هذا ملف توضيحي تم إنشاؤه تلقائياً لعرض المزايا (صفحة 1).', { x: 40, y: 740, size: 12, font });

            const page2 = pdfDoc.addPage([595, 842]);
            page2.drawText('PDF Tools — Demo Page 2', { x: 40, y: 780, size: 24, font });
            page2.drawText('يمكن تدوير، حذف، وترتيب الصفحات ثم حفظ ملف عالي الجودة.', { x: 40, y: 740, size: 12, font });

            const bytes = await pdfDoc.save();
            // Create a File-like object and pass to loadFiles
            try {
                const file = new File([bytes], 'sample-demo.pdf', { type: 'application/pdf' });
                await loadFiles([file], 'pdf');
            } catch (e) {
                // Fallback for environments without File constructor
                const blob = new Blob([bytes], { type: 'application/pdf' });
                await loadFiles([blob], 'pdf');
            }
        }

        async function renderPdfPageToThumbnail(pdfJsDoc, pageNumber, maxW = 800, maxH = 600) {
            try {
                const page = await pdfJsDoc.getPage(pageNumber);
                const viewport = page.getViewport({ scale: 1, rotation: 0 });
                const scale = Math.min(maxW / viewport.width, maxH / viewport.height, 1);
                const scaledViewport = page.getViewport({ scale, rotation: 0 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const ratio = window.devicePixelRatio || 1;
                canvas.width = Math.floor(scaledViewport.width * ratio);
                canvas.height = Math.floor(scaledViewport.height * ratio);
                canvas.style.width = `${Math.floor(scaledViewport.width)}px`;
                canvas.style.height = `${Math.floor(scaledViewport.height)}px`;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
                return canvas.toDataURL('image/png');
            } catch (e) {
                console.warn('Thumbnail render failed', e);
                return null;
            }
        }

        async function renderImageToThumbnail(blob, maxW = 1200, maxH = 900) {
            return new Promise((res) => {
                const img = new Image();
                img.onload = () => {
                    const ratio = window.devicePixelRatio || 1;
                    const scale = Math.min(maxW / img.width, maxH / img.height, 1);
                    const w = Math.floor(img.width * scale);
                    const h = Math.floor(img.height * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(w * ratio);
                    canvas.height = Math.floor(h * ratio);
                    canvas.style.width = `${w}px`;
                    canvas.style.height = `${h}px`;
                    const ctx = canvas.getContext('2d');
                    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                    ctx.drawImage(img, 0, 0, w, h);
                    res(canvas.toDataURL('image/png'));
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        let currentPreviewIndex = 0;
        function openPreview(index) {
            currentPreviewIndex = index;
            document.getElementById('previewModal').classList.remove('hidden');
            showPreview(index);
        }
        function closePreview() {
            document.getElementById('previewModal').classList.add('hidden');
        }
        document.getElementById('closePreview').addEventListener('click', closePreview);
        document.getElementById('prevPage').addEventListener('click', () => { if (currentPreviewIndex > 0) { currentPreviewIndex--; showPreview(currentPreviewIndex); } });
        document.getElementById('nextPage').addEventListener('click', () => { if (currentPreviewIndex < loadedPages.length - 1) { currentPreviewIndex++; showPreview(currentPreviewIndex); } });
        document.getElementById('rotatePreview').addEventListener('click', () => { rotatePage(loadedPages[currentPreviewIndex].id); showPreview(currentPreviewIndex); });
        document.getElementById('deletePreview').addEventListener('click', () => { deletePage(loadedPages[currentPreviewIndex].id); });

        async function showPreview(index) {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');
            const p = loadedPages[index];
            document.getElementById('previewLabel').innerText = `صفحة ${index + 1}`;
            // Fit canvas to container
            const container = canvas.parentElement.getBoundingClientRect();
            const maxW = container.width - 40;
            const maxH = container.height - 40;
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.floor(maxW * ratio);
            canvas.height = Math.floor(maxH * ratio);
            canvas.style.width = `${maxW}px`;
            canvas.style.height = `${maxH}px`;
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, maxW, maxH);

            if (p.type === 'pdf' && p.pdfJs) {
                const page = await p.pdfJs.getPage(p.pageIndex + 1);
                const viewport = page.getViewport({ scale: 1, rotation: p.rotation });
                const scale = Math.min(maxW / viewport.width, maxH / viewport.height, 2);
                const scaledViewport = page.getViewport({ scale, rotation: p.rotation });
                canvas.width = Math.floor(scaledViewport.width * ratio);
                canvas.height = Math.floor(scaledViewport.height * ratio);
                canvas.style.width = `${Math.floor(scaledViewport.width)}px`;
                canvas.style.height = `${Math.floor(scaledViewport.height)}px`;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
            } else if (p.type === 'img') {
                const img = new Image();
                await new Promise((res) => {
                    img.onload = res;
                    img.src = p.thumbnail || URL.createObjectURL(new Blob([p.bytes], { type: p.imgType }));
                });
                // draw centered
                const scale = Math.min(maxW / img.width, maxH / img.height, 2);
                const w = img.width * scale, h = img.height * scale;
                canvas.width = Math.floor(w * ratio);
                canvas.height = Math.floor(h * ratio);
                canvas.style.width = `${Math.floor(w)}px`;
                canvas.style.height = `${Math.floor(h)}px`;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                // handle rotation
                if (p.rotation % 360 !== 0) {
                    ctx.save();
                    ctx.translate(w/2, h/2);
                    ctx.rotate(p.rotation * Math.PI/180);
                    ctx.drawImage(img, -w/2, -h/2, w, h);
                    ctx.restore();
                } else {
                    ctx.drawImage(img, 0, 0, w, h);
                }
            }
        }

        // close modal on backdrop click
        document.getElementById('previewModal').addEventListener('click', (e) => {
            if (e.target.id === 'previewModal') closePreview();
        });

        // Loader control functions
        function showLoader(total) {
            const overlay = document.getElementById('loaderOverlay');
            const bar = document.getElementById('loaderBar');
            const percent = document.getElementById('loaderPercent');
            const text = document.getElementById('loaderText');
            overlay.classList.remove('hidden');
            bar.style.width = '0%';
            percent.innerText = `0%`;
            text.innerText = `جاري معالجة ${total} عناصر...`;
        }
        function updateLoader(done, total) {
            const bar = document.getElementById('loaderBar');
            const percent = document.getElementById('loaderPercent');
            const p = Math.round((done / total) * 100);
            bar.style.width = p + '%';
            percent.innerText = `${p}%`;
        }
        function hideLoader() {
            const overlay = document.getElementById('loaderOverlay');
            overlay.classList.add('hidden');
        }

        // ----- End helpers -----

        async function saveFinalPDF() {
            const { PDFDocument, degrees } = PDFLib;
            const highQuality = document.getElementById('highQuality') ? document.getElementById('highQuality').checked : true;
            const newPdf = await PDFDocument.create();
            
            for (const p of loadedPages) {
                if (p.type === 'pdf') {
                    const [copiedPage] = await newPdf.copyPages(p.srcDoc, [p.pageIndex]);
                    if (p.rotation !== 0) copiedPage.setRotation(degrees(p.rotation));
                    newPdf.addPage(copiedPage);
                } else {
                    let img;
                    // Prefer PNG embedding for lossless quality when possible
                    if (p.imgType === "image/png") img = await newPdf.embedPng(p.bytes);
                    else if (p.imgType === "image/jpeg" || p.imgType === "image/jpg") img = await newPdf.embedJpg(p.bytes);
                    else img = await newPdf.embedPng(p.bytes);
                    // Use original pixel dimensions (high quality). Cap to a reasonable max to avoid excessively huge PDFs
                    const maxDim = 4000;
                    const width = Math.min(img.width, maxDim);
                    const height = Math.min(img.height, maxDim);
                    const page = newPdf.addPage([width, height]);
                    page.drawImage(img, { x: 0, y: 0, width: width, height: height });
                    if (p.rotation !== 0) page.setRotation(degrees(p.rotation));
                }
            }

            const pdfBytes = await newPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `PDF_Tools_Export_${new Date().toISOString().replace(/[:.]/g,'-')}.pdf`;
            link.click();
        }
    </script>
</body>
</html>
